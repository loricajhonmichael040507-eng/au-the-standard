
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | AU THE STANDARD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="about">
      <span class="category">AU THE STANDARD</span>
      <h1>Create Your Account</h1>
      <p>Join our campus journalism community.</p>

      <form id="register-form">
        <label for="full-name">Full Name</label>
        <input
          id="full-name"
          name="full-name"
          type="text"
          autocomplete="name"
          required
        >

        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button type="submit">CREATE ACCOUNT</button>

        <p id="register-message" role="status" aria-live="polite"></p>
      </form>

      <p>Already registered? <a href="admin.html">Staff login</a></p>
      <a href="index.html">← Back to homepage</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="register.js"></script>
</body>
</html>
