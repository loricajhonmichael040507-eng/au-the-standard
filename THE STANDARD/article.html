
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Article | AU THE STANDARD</title>

  <!-- Montserrat Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

  <style>
    :root {
      --teal-dark: #052f30;
      --teal: #087c78;
      --yellow: #f1d85b;
      --cream: #f6f7f2;
      --ink: #152e2c;
      --muted: #6b7e79;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Montserrat", sans-serif;
    }

    /* CINEMATIC TEAL HEADER */

    .site-header {
      position: relative;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(
          circle at 85% 0%,
          rgba(54, 181, 165, 0.28),
          transparent 35%
        ),
        linear-gradient(
          125deg,
          #052f30 0%,
          #075956 48%,
          #087c78 100%
        );
      border-bottom: 4px solid var(--yellow);
    }

    .site-header::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      top: -170px;
      right: 8%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      box-shadow:
        0 0 0 28px rgba(255, 255, 255, 0.025),
        0 0 0 56px rgba(255, 255, 255, 0.025);
      pointer-events: none;
    }

    /* MASTHEAD AND LOGO */

    .masthead {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 48px));
      min-height: 112px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 0;
    }

    .publication-brand {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
      color: var(--white);
      text-decoration: none;
    }

    .au-logo {
      display: block;
      width: 70px;
      height: 70px;
      flex: 0 0 70px;
      object-fit: contain;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      min-width: 0;
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      white-space: nowrap;
      line-height: 1;
    }

    .publication-brand .brand-au,
    .publication-brand .brand-name {
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-family: "Montserrat", sans-serif;
      font-size: clamp(22px, 3.2vw, 36px);
      line-height: 1;
    }

    .publication-brand .brand-au {
      font-weight: 400;
      letter-spacing: -1px;
    }

    .publication-brand .brand-name {
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .publication-brand .brand-campus {
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2.3px;
      line-height: 1.3;
    }

    .header-label {
      flex-shrink: 0;
      padding-left: 15px;
      border-left: 2px solid var(--yellow);
      color: #e0eeea;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.2px;
      line-height: 1.8;
      text-align: right;
      text-transform: uppercase;
    }

    /* ARTICLE PAGE */

    .article-page {
      width: min(100% - 48px, 1050px);
      margin: 0 auto;
      padding: 35px 0 85px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 32px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--teal-dark);
    }

    .back-arrow {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid #cbdcd5;
      border-radius: 50%;
      font-size: 17px;
      transition: background 0.2s ease;
    }

    .back-link:hover .back-arrow {
      background: var(--yellow);
    }

    #article-content {
      min-width: 0;
    }

    .article-category {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 20px;
      padding: 9px 12px;
      color: var(--teal-dark);
      background: #e9edcc;
      border-left: 3px solid var(--yellow);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .article-category::before {
      content: "";
      width: 6px;
      height: 6px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--teal);
    }

    .article-title {
      max-width: 900px;
      margin: 0 0 22px;
      color: var(--teal-dark);
      font-family: "Montserrat", sans-serif;
      font-size: clamp(34px, 5.5vw, 65px);
      font-weight: 800;
      letter-spacing: -2.2px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.8;
    }

    .article-meta::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--yellow);
    }

    .article-hero {
      display: block;
      width: 100%;
      max-height: 590px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      object-position: center;
      background: #dce8e2;
      border-radius: 5px;
      box-shadow: 0 20px 45px rgba(5, 47, 48, 0.13);
    }

    .article-body {
      width: min(100%, 740px);
      margin: 45px auto 0;
      color: #2c3e3b;
      font-size: 16px;
      font-weight: 400;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .article-body p {
      margin: 0 0 25px;
    }

    .article-body p:first-child {
      color: #243c37;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.9;
    }

    /* FOOTER */

    .article-footer {
      position: relative;
      overflow: hidden;
      padding: 35px 24px;
      color: var(--white);
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(54, 181, 165, 0.2),
          transparent 35%
        ),
        linear-gradient(120deg, #052f30, #087c78);
      border-top: 4px solid var(--yellow);
    }

    .footer-inner {
      width: min(1050px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-brand {
      color: var(--white);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .footer-brand span {
      color: var(--yellow);
    }

    .footer-note {
      margin-top: 7px;
      color: #c2dcd6;
      font-size: 10px;
      line-height: 1.8;
    }

    .footer-top {
      color: var(--yellow);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
    }

    .footer-top:hover {
      text-decoration: underline;
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .masthead {
        width: calc(100% - 28px);
        min-height: 88px;
        gap: 10px;
      }

      .publication-brand {
        gap: 9px;
      }

      .au-logo {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      .brand-title {
        gap: 6px;
      }

      .publication-brand .brand-au,
      .publication-brand .brand-name {
        font-size: clamp(16px, 4.5vw, 25px);
        letter-spacing: -0.7px;
      }

      .publication-brand .brand-campus {
        font-size: 8px;
        letter-spacing: 1.5px;
      }

      .header-label {
        max-width: 105px;
        padding-left: 8px;
        font-size: 8px;
        letter-spacing: 0.6px;
      }

      .article-page {
        width: calc(100% - 32px);
        padding-top: 25px;
        padding-bottom: 55px;
      }

      .back-link {
        margin-bottom: 28px;
      }

      .article-category {
        margin-bottom: 16px;
        font-size: 9px;
      }

      .article-title {
        margin-bottom: 17px;
        font-size: clamp(32px, 9vw, 46px);
        letter-spacing: -1.2px;
        line-height: 1.12;
      }

      .article-meta {
        margin-bottom: 23px;
        font-size: 10px;
      }

      .article-hero {
        aspect-ratio: 4 / 3;
        border-radius: 4px;
      }

      .article-body {
        margin-top: 30px;
        font-size: 15px;
        line-height: 1.9;
      }

      .article-body p:first-child {
        font-size: 16px;
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 380px) {
      .header-label {
        display: none;
      }

      .publication-brand .brand-au,
      .publication-brand .brand-name {
        font-size: 17px;
      }

      .article-title {
        font-size: 31px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="masthead">

      <a
        class="publication-brand"
        href="index.html"
        aria-label="AU THE STANDARD — Jose Rizal Campus"
      >
        <img
          class="au-logo"
          src="images/au-logo.png"
          alt="Arellano University logo"
        />

        <div class="brand-wrap">
          <div class="brand-title">
            <span class="brand-au">AU</span>
            <span class="brand-name">THE STANDARD</span>
          </div>

          <div class="brand-campus">JOSE RIZAL CAMPUS</div>
        </div>
      </a>

      <div class="header-label">
        Campus Journalism<br />
        Stories That Matter
      </div>

    </div>
  </header>

  <main class="article-page">
    <a class="back-link" href="index.html">
      <span class="back-arrow" aria-hidden="true">←</span>
      Back to homepage
    </a>

    <article id="article-content">
      <p>Loading article...</p>
    </article>
  </main>

  <footer class="article-footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">
          AU THE STANDARD
        </div>

        <div class="footer-note">
          Jose Rizal Campus<br />
          Truth. Integrity. The Student Voice.
        </div>
      </div>

      <a class="footer-top" href="#">BACK TO TOP ↑</a>
    </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="article.js"></script></body>
</html>
