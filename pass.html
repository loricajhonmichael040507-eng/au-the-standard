
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#052f30">
  <title>Staff Access Pass | AU THE STANDARD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root {
      --teal-dark: #052f30;
      --teal: #087c78;
      --gold: #f1d85b;
      --cream: #f7f4e9;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, #15958b55, transparent 55%),
        var(--teal-dark);
      color: var(--cream);
      font-family: Montserrat, sans-serif;
    }

    .ambient {
      position: fixed;
      inset: -40%;
      pointer-events: none;
      background: conic-gradient(
        from 0deg,
        transparent,
        #f1d85b10,
        transparent,
        #15958b22,
        transparent
      );
      animation: ambient-spin 18s linear infinite;
    }

    .pass {
      position: relative;
      width: min(100%, 440px);
      padding: 34px 28px;
      overflow: hidden;
      border: 1px solid #f1d85b80;
      border-radius: 22px;
      background: linear-gradient(145deg, #087c78f2, #052f30 78%);
      box-shadow: 0 24px 90px #0006, 0 0 45px #15958b20;
      animation: pass-enter 1s cubic-bezier(.2,.8,.2,1) both;
    }

    .pass::before {
      content: "";
      position: absolute;
      top: -80%;
      left: -60%;
      width: 45%;
      height: 260%;
      transform: rotate(25deg);
      background: linear-gradient(
        90deg,
        transparent,
        #ffffff13,
        #f1d85b30,
        transparent
      );
      animation: light-sweep 2s ease-out .4s both;
      pointer-events: none;
    }

    .pass-content {
      position: relative;
      z-index: 1;
    }

    .seal {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      margin-bottom: 22px;
      border: 1px solid #f1d85b99;
      border-radius: 50%;
      color: var(--gold);
      font-size: 28px;
      box-shadow: 0 0 28px #f1d85b20;
      animation: seal-glow 2s ease-in-out infinite alternate;
    }

    .brand {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
    }

    .eyebrow {
      margin: 22px 0 8px;
      color: #bde5df;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 6vw, 32px);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: #d5e8e5;
      font-size: 11px;
      letter-spacing: 1.7px;
    }

    .divider {
      height: 1px;
      margin: 26px 0;
      background: linear-gradient(90deg, transparent, #f1d85b99, #ffffff25, transparent);
    }

    .label {
      margin-top: 18px;
      color: #bde5df;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .value {
      margin-top: 7px;
      font-size: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .status {
      margin-top: 26px;
      padding: 13px;
      border: 1px solid #f1d85b50;
      border-radius: 10px;
      background: #f1d85b12;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.6;
      text-align: center;
    }

    .status.invalid {
      border-color: #ffaaaa66;
      background: #ff646418;
      color: #ffb9b9;
    }

    .progress-track {
      height: 3px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 10px;
      background: #ffffff20;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: var(--gold);
    }

    .pass.ready .progress {
      animation: countdown 6s linear forwards;
    }

    .note {
      margin: 22px 0 0;
      color: #c5e2df;
      font-size: 10px;
      line-height: 1.8;
      text-align: center;
    }

    .tap-hint {
      margin-top: 16px;
      color: #f1d85b;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-align: center;
      animation: hint-pulse 1.5s ease-in-out infinite;
    }

    .pass.invalid-pass .progress-track,
    .pass.invalid-pass .tap-hint {
      display: none;
    }

    .pass.leaving {
      animation: pass-leave .45s ease-in forwards;
    }

    @keyframes pass-enter {
      from { opacity: 0; transform: translateY(25px) scale(.96); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes pass-leave {
      to { opacity: 0; transform: translateY(-15px) scale(1.02); filter: blur(6px); }
    }

    @keyframes light-sweep {
      from { left: -70%; }
      to { left: 160%; }
    }

    @keyframes ambient-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes seal-glow {
      from { box-shadow: 0 0 12px #f1d85b10; }
      to { box-shadow: 0 0 30px #f1d85b45; }
    }

    @keyframes countdown {
      to { width: 100%; }
    }

    @keyframes hint-pulse {
      50% { opacity: .55; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="pass" id="passCard">
    <div class="pass-content">
      <div class="seal" aria-hidden="true">✦</div>
      <div class="brand">AU THE STANDARD</div>

      <p class="eyebrow">Official Publication Access</p>
      <h1>Staff Access Pass</h1>
      <p class="subtitle">JOSE RIZAL CAMPUS</p>

      <div class="divider"></div>

      <div class="label">Staff Name</div>
      <div class="value" id="staffName">Verifying pass...</div>

      <div class="label">Staff ID</div>
      <div class="value" id="staffId">—</div>

      <div class="status" id="status" role="status" aria-live="polite">
        Connecting to verification service...
      </div>

      <div class="progress-track" aria-hidden="true">
        <div class="progress"></div>
      </div>

      <div class="tap-hint" id="tapHint" hidden>
        TAP ANYWHERE TO CONTINUE
      </div>

      <p class="note">
        TRUTH CONQUERS ALL<br>
        Official staff pass verification
      </p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://gxihhayyyxiauoqrkokp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Q6p-7zDpsKmchrRiCA7TBg_JOZajsxX";

    const card = document.getElementById("passCard");
    const statusEl = document.getElementById("status");
    const staffNameEl = document.getElementById("staffName");
    const staffIdEl = document.getElementById("staffId");
    const tapHint = document.getElementById("tapHint");

    const params = new URLSearchParams(window.location.search);
    const passId = params.get("id");

    let canContinue = false;
    let hasContinued = false;
    let countdownTimer;

    function showInvalid(message) {
      card.classList.add("invalid-pass");
      staffNameEl.textContent = "Unverified";
      staffIdEl.textContent = "—";
      statusEl.textContent = message;
      statusEl.classList.add("invalid");
    }

    function continueToHomepage() {
      if (!canContinue || hasContinued) return;

      hasContinued = true;
      clearTimeout(countdownTimer);
      card.classList.add("leaving");

      setTimeout(() => {
        window.location.replace("index.html");
      }, 450);
    }

    async function verifyPass() {
      if (!passId) {
        showInvalid("No pass ID provided.");
        return;
      }

      try {
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/verify-public-pass`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY
            },
            body: JSON.stringify({ pass_id: passId })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.valid) {
          showInvalid(result.message || "Pass verification failed.");
          return;
        }

        if (!result.staff_name || !result.staff_id) {
          showInvalid("Staff information is incomplete.");
          return;
        }

        staffNameEl.textContent = result.staff_name;
        staffIdEl.textContent = result.staff_id;
        statusEl.textContent = "✓ " + (result.message || "Active pass verified.");

        canContinue = true;
        card.classList.add("ready");
        tapHint.hidden = false;

        countdownTimer = setTimeout(continueToHomepage, 6000);

      } catch (error) {
        console.error("Pass verification error:", error);
        showInvalid("Unable to verify. Please try again.");
      }
    }

    document.addEventListener("click", continueToHomepage);
    document.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        continueToHomepage();
      }
    });

    verifyPass();
  </script>
</body>
</html>
